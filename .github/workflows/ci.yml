name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
      s3:
        image: adobe/s3mock
        ports:
          - 9090:9090
    env:
      RIVO_DYNAMODB_ENDPOINT: http://localhost:8000
      RIVO_S3_ENDPOINT: http://localhost:9090
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/shared/go.mod
          cache-dependency-path: services/**/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make install
      - run: make check

  # Every feature or fix that reaches main becomes a release, once the checks above pass. The version comes from the
  # commit messages: fix: is a patch, feat: a minor version, a breaking change the major one. See CONTRIBUTING.md.
  release:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
