name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "The release tag you deployed, or the commit SHA if you built from source."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Where you run it
      description: System, browser or device, and how you installed it.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove passwords, tokens and personal data before pasting.
      render: text
